<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Ash Runner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: none;
}
canvas {
  display: block;
  width: 100vw !important;
  height: 100vh !important;
}
</style>
</head>
<body>

<!-- Three.js -->
<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>

<script>
/* =====================
   THREE SETUP
===================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* Lights */
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const light = new THREE.DirectionalLight(0xffffff, 0.6);
light.position.set(5, 10, 5);
scene.add(light);

/* Ground */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 500),
  new THREE.MeshStandardMaterial({ color: 0x333333 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.z = -250;
scene.add(ground);

/* Player */
const player = new THREE.Mesh(
  new THREE.BoxGeometry(1, 1.2, 1),
  new THREE.MeshStandardMaterial({ color: 0x00ffcc })
);
player.position.set(0, 0.6, 0);
scene.add(player);

/* =====================
   GAME CONSTANTS
===================== */
const forwardSpeed = 0.15;
const laneSpeed = 0.6;
const gravity = -0.015;
const jumpForce = 0.35;

let velocityY = 0;
let isJumping = false;
let isSliding = false;

/* =====================
   TOUCH CONTROLS
===================== */
let touchStartX = 0;
let touchStartY = 0;

window.addEventListener("touchstart", e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});

window.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;

  // Swipe threshold
  if (Math.abs(dy) > Math.abs(dx)) {
    if (dy < -40 && !isJumping) {
      velocityY = jumpForce;
      isJumping = true;
    } else if (dy > 40 && !isSliding) {
      slide(true);
      setTimeout(() => slide(false), 500);
    }
  } else {
    if (dx > 40) player.position.x += laneSpeed;
    if (dx < -40) player.position.x -= laneSpeed;
  }

  player.position.x = THREE.MathUtils.clamp(player.position.x, -4, 4);
});

function slide(state) {
  isSliding = state;
  player.scale.y = state ? 0.5 : 1;
}

/* =====================
   CAMERA FOLLOW
===================== */
function updateCamera() {
  camera.position.lerp(
    new THREE.Vector3(
      player.position.x,
      player.position.y + 5,
      player.position.z + 8
    ),
    0.1
  );
  camera.lookAt(player.position.x, player.position.y + 1, player.position.z - 5);
}

/* =====================
   GAME LOOP
===================== */
function animate() {
  requestAnimationFrame(animate);

  /* Forward movement */
  player.position.z -= forwardSpeed;
  if (player.position.z < -400) player.position.z = 0;

  /* Gravity */
  velocityY += gravity;
  player.position.y += velocityY;

  if (player.position.y <= 0.6) {
    player.position.y = 0.6;
    velocityY = 0;
    isJumping = false;
  }

  updateCamera();
  renderer.render(scene, camera);
}

animate();

/* Resize */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
