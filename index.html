<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Three.js Hand Control Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #000;
  }
  video {
    position: fixed;
    bottom: 10px;
    right: 10px;
    width: 160px;
    opacity: 0.3;
    z-index: 10;
  }
</style>
</head>
<body>

<video id="video" autoplay playsinline></video>

<!-- Three.js -->
<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
/* ==========================
   THREE.JS SETUP
========================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(
  60, window.innerWidth / window.innerHeight, 0.1, 1000
);
camera.position.set(0, 6, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* Light */
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);

/* Ground */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.MeshStandardMaterial({ color: 0x222222 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

/* Player */
const player = new THREE.Mesh(
  new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshStandardMaterial({ color: 0x00ffcc })
);
player.position.y = 0.5;
scene.add(player);

/* ==========================
   HAND TRACKING
========================== */
const video = document.getElementById("video");

const hands = new Hands({
  locateFile: file =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 1,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});

let handX = 0;
let handY = 0;

hands.onResults(results => {
  if (results.multiHandLandmarks.length > 0) {
    const indexTip = results.multiHandLandmarks[0][8];

    // Normalized (0–1)
    handX = indexTip.x;
    handY = indexTip.y;
  }
});

const cameraFeed = new Camera(video, {
  onFrame: async () => {
    await hands.send({ image: video });
  },
  width: 640,
  height: 480
});
cameraFeed.start();

/* ==========================
   GAME LOOP
========================== */
function animate() {
  requestAnimationFrame(animate);

  /* Map hand position to movement */
  const speed = 0.15;
  player.position.x += (handX - 0.5) * speed * 5;
  player.position.z += (handY - 0.5) * speed * 5;

  /* Clamp movement */
  player.position.x = THREE.MathUtils.clamp(player.position.x, -8, 8);
  player.position.z = THREE.MathUtils.clamp(player.position.z, -8, 8);

  renderer.render(scene, camera);
}

animate();

/* Resize */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
