<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Ash Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}
canvas {
  display: block;
  width: 100vw !important;
  height: 100vh !important;
  touch-action: none;
}
video {
  display: none !important; /* hide camera */
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>

<!-- Three.js -->
<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
/* =====================
   THREE SETUP
===================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 6, 10);
camera.lookAt(0, 1, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const light = new THREE.DirectionalLight(0xffffff, 0.6);
light.position.set(5, 10, 5);
scene.add(light);

/* Ground */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 200),
  new THREE.MeshStandardMaterial({ color: 0x333333 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.z = -80;
scene.add(ground);

/* Player */
const player = new THREE.Mesh(
  new THREE.BoxGeometry(1, 1.2, 1),
  new THREE.MeshStandardMaterial({ color: 0x00ffcc })
);
player.position.set(0, 0.6, 2);
scene.add(player);

/* =====================
   PLAYER PHYSICS
===================== */
let velocityY = 0;
let isJumping = false;
let isCrouching = false;

const gravity = -0.015;
const jumpForce = 0.35;
const forwardSpeed = 0.15;

/* =====================
   HAND INPUT
===================== */
let handX = 0.5;
let handY = 0.5;

const hands = new Hands({
  locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 1,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});

hands.onResults(results => {
  if (results.multiHandLandmarks.length) {
    const tip = results.multiHandLandmarks[0][8];
    handX = tip.x;
    handY = tip.y;
  }
});

const cameraFeed = new Camera(document.getElementById("video"), {
  onFrame: async () => {
    await hands.send({ image: video });
  },
  width: 640,
  height: 480
});
cameraFeed.start();

/* =====================
   GAME LOOP
===================== */
function animate() {
  requestAnimationFrame(animate);

  /* Constant forward movement */
  player.position.z -= forwardSpeed;
  if (player.position.z < -80) player.position.z = 2;

  /* LEFT / RIGHT */
  const laneMove = (handX - 0.5) * 0.4;
  player.position.x += laneMove;
  player.position.x = THREE.MathUtils.clamp(player.position.x, -4, 4);

  /* JUMP */
  if (handY < 0.3 && !isJumping) {
    velocityY = jumpForce;
    isJumping = true;
  }

  /* CROUCH */
  if (handY > 0.7 && !isCrouching) {
    player.scale.y = 0.5;
    isCrouching = true;
  } else if (handY <= 0.7 && isCrouching) {
    player.scale.y = 1;
    isCrouching = false;
  }

  /* GRAVITY */
  velocityY += gravity;
  player.position.y += velocityY;

  if (player.position.y <= 0.6) {
    player.position.y = 0.6;
    velocityY = 0;
    isJumping = false;
  }

  renderer.render(scene, camera);
}

animate();

/* Resize */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
